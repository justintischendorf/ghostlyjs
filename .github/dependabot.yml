version: 2

updates:
  # npm dependencies (bun.lock) of the root and all workspaces
  - package-ecosystem: bun
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR for all minor and patch updates, majors stay separate
      minor-and-patch:
        update-types: [minor, patch]

  # Actions used in .github/workflows (actions/checkout, setup-bun, ...)
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
